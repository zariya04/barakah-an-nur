<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - BARAKAH AN NUR</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
      <nav
        class="container mx-auto px-4 py-4 flex justify-between items-center"
      >
        <img
          src="images/logo.png"
          alt="BARAKAH AN NUR"
          class="sm:h-16 h-12 w-auto"
        />
        <div class="hidden md:flex space-x-6">
          <a
            href="index.html"
            class="text-gray-900 font-semibold hover:text-amber-700"
            >HOME</a
          >
          <a
            href="collections.html"
            class="text-gray-900 font-semibold hover:text-amber-700"
            >COLLECTIONS</a
          >
          <a
            href="index.html#contact"
            class="text-gray-900 font-semibold hover:text-amber-700"
            >CONTACT</a
          >
        </div>
        <!-- Mobile menu button -->
        <button id="mobileMenuBtn" class="md:hidden text-gray-900">
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
      </nav>
      <!-- Mobile menu -->
      <div id="mobileMenu" class="hidden md:hidden bg-white border-t">
        <div class="container mx-auto px-4 py-4 space-y-3">
          <a href="index.html" class="block text-gray-900 font-semibold"
            >HOME</a
          >
          <a href="collections.html" class="block text-gray-900 font-semibold"
            >COLLECTIONS</a
          >
          <a href="index.html#contact" class="block text-gray-900 font-semibold"
            >CONTACT</a
          >
        </div>
      </div>
    </header>

    <!-- Product Detail Section -->
    <section class="py-12 bg-white">
      <div class="container mx-auto px-4">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
          <!-- Product Images -->
          <div>
            <div class="mb-4">
              <div
                id="mainImage"
                class="w-full h-96 bg-gray-200 rounded-lg overflow-hidden mb-4"
              >
                <img
                  id="mainImageSrc"
                  src="images/4.jpeg"
                  alt="Product"
                  class="w-full h-full object-cover"
                />
              </div>
              <p id="mainImageLabel" class="text-sm text-gray-600 mb-4">
                Cabinets - Main View
              </p>
            </div>
            <div
              id="thumbnailContainer"
              class="grid grid-cols-2 md:grid-cols-4 gap-2"
            >
              <!-- Thumbnails will be loaded dynamically by JavaScript -->
            </div>
          </div>

          <!-- Product Details -->
          <div>
            <h1
              id="productName"
              class="text-4xl md:text-5xl font-bold text-gray-900 mb-4"
            > Cabinets
            </h1>

            <!-- Order Section -->
            <div class="border border-gray-300 rounded-lg p-6 bg-gray-50">
              <p class="text-gray-700 mb-4">
                Order through WhatsApp and have payment plan.
              </p>
              <button
                id="whatsappOrderBtn"
                onclick="orderViaWhatsApp()"
                class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-4 px-6 rounded-lg flex items-center justify-center space-x-2 transition-colors mb-4"
              >
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                  <path
                    d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"
                  />
                </svg>
                <span>Order & Consult via WhatsApp</span>
              </button>
              <p class="text-xs text-gray-600">
                We will confirm all details, including shipping and payment
                (Bank Transfer, CoD, etc.), in the chat.
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Floating WhatsApp Button -->
    <button
      onclick="contactViaWhatsApp()"
      class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white rounded-full p-4 shadow-lg hover:shadow-xl transition-all z-50"
    >
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"
        />
      </svg>
    </button>

    <script src="script.js"></script>
  </body>
</html>
